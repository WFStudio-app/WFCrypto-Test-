<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WFStudio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --indigo: #6366f1;
    --violet: #8b5cf6;
    --cyan: #06b6d4;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(148,163,184,0.1);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #03030e;
    color: var(--text);
    overflow-x: hidden;
  }

  #cosmos {
    position: fixed; inset: 0; z-index: 0;
  }

  .nebula {
    position: fixed; border-radius: 50%;
    filter: blur(90px); pointer-events: none; z-index: 1;
    animation: nbPulse ease-in-out infinite alternate;
  }
  .nb1 { width:700px; height:600px; top:-12%; left:-8%;
    background: radial-gradient(ellipse, rgba(99,102,241,0.16) 0%, transparent 70%);
    animation-duration: 9s; }
  .nb2 { width:800px; height:650px; bottom:-18%; right:-12%;
    background: radial-gradient(ellipse, rgba(139,92,246,0.13) 0%, transparent 70%);
    animation-duration: 12s; animation-delay:-4s; }
  .nb3 { width:450px; height:450px; top:38%; left:52%;
    background: radial-gradient(ellipse, rgba(6,182,212,0.09) 0%, transparent 70%);
    animation-duration: 10s; animation-delay:-6s; }
  @keyframes nbPulse {
    from { opacity:.55; transform:scale(1); }
    to   { opacity:1;   transform:scale(1.09); }
  }

  .page {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 26px 40px; gap: 10px;
  }
  .soc {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 100px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--muted); text-decoration: none;
    font-size: 13px; font-weight: 500;
    backdrop-filter: blur(14px);
    transition: all .25s cubic-bezier(.4,0,.2,1);
  }
  .soc svg { width:15px; height:15px; flex-shrink:0; }
  .soc:hover {
    border-color: rgba(99,102,241,.55);
    color: var(--text);
    background: rgba(99,102,241,.1);
    box-shadow: 0 0 24px rgba(99,102,241,.18);
    transform: translateY(-1px);
  }

  main {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding: 0 24px 80px; text-align:center;
  }

  .orbital {
    position: relative; margin-bottom: 48px;
    width: 160px; height: 160px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring {
    position:absolute; border-radius:50%;
    animation: spin linear infinite;
  }
  .ring1 { width:152px; height:152px;
    border: 1px solid rgba(99,102,241,.3);
    animation-duration:20s; }
  .ring2 { width:112px; height:112px;
    border: 1px solid rgba(139,92,246,.22);
    animation-duration:14s; animation-direction:reverse; }
  .ring3 { width:72px; height:72px;
    border: 1px solid rgba(6,182,212,.18);
    animation-duration:9s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rdot {
    position:absolute; border-radius:50%;
    width:5px; height:5px;
    top:-2.5px; left:calc(50% - 2.5px);
  }
  .rdot1 { background:#6366f1; box-shadow:0 0 8px #6366f1, 0 0 3px #6366f1; }
  .rdot2 { background:#8b5cf6; box-shadow:0 0 8px #8b5cf6, 0 0 3px #8b5cf6; }
  .rdot3 { background:#06b6d4; box-shadow:0 0 8px #06b6d4, 0 0 3px #06b6d4;
    width:4px; height:4px; top:-2px; left:calc(50% - 2px); }

  .core {
    width:50px; height:50px; border-radius:50%;
    background: radial-gradient(circle at 36% 36%,
      rgba(99,102,241,.55), rgba(139,92,246,.3) 55%, rgba(6,182,212,.1));
    border: 1px solid rgba(99,102,241,.45);
    box-shadow: 0 0 22px rgba(99,102,241,.3), 0 0 44px rgba(99,102,241,.12),
                inset 0 0 22px rgba(139,92,246,.2);
    animation: coreGlow 4s ease-in-out infinite alternate;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; letter-spacing:.06em;
    color:rgba(200,210,255,.9);
  }
  @keyframes coreGlow {
    from { box-shadow:0 0 22px rgba(99,102,241,.3),0 0 44px rgba(99,102,241,.1),inset 0 0 22px rgba(139,92,246,.2); }
    to   { box-shadow:0 0 32px rgba(99,102,241,.55),0 0 64px rgba(99,102,241,.22),inset 0 0 30px rgba(139,92,246,.38); }
  }

  h1 {
    font-size: clamp(56px,11vw,108px);
    font-weight: 900;
    letter-spacing: -0.045em;
    line-height: 1;
    background: linear-gradient(135deg,
      #e0e7ff 0%, #a5b4fc 28%, #c4b5fd 52%, #67e8f9 78%, #e0e7ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    background-size: 220% 220%;
    animation: shimmer 7s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 48px rgba(99,102,241,.38));
  }
  @keyframes shimmer {
    from { background-position: 0% 50%; }
    to   { background-position: 100% 50%; }
  }

  .sub {
    margin-top: 16px; margin-bottom: 56px;
    font-size: clamp(12px,1.8vw,14px);
    color: var(--muted); font-weight:400;
    letter-spacing: .2em; text-transform:uppercase;
    opacity:.65;
  }

  .cta {
    position:relative; display:inline-flex; align-items:center; gap:13px;
    padding: 19px 52px; border-radius:100px;
    border: 1px solid rgba(99,102,241,.45);
    background: linear-gradient(135deg, rgba(99,102,241,.13), rgba(139,92,246,.08));
    color:#dde4ff; font-size:17px; font-weight:600;
    font-family:'Inter',system-ui,sans-serif; letter-spacing:.02em;
    cursor:pointer; text-decoration:none;
    backdrop-filter: blur(18px);
    overflow:hidden;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1),
                box-shadow .3s ease, border-color .3s ease;
    box-shadow: 0 0 0 0 rgba(99,102,241,0), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .cta::before {
    content:''; position:absolute; top:0; left:-110%;
    width:100%; height:100%;
    background: linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
    transition: left .55s ease;
  }
  .cta:hover::before { left:110%; }
  .cta:hover {
    transform: scale(1.07) translateY(-2px);
    border-color: rgba(139,92,246,.8);
    box-shadow: 0 0 32px rgba(99,102,241,.38), 0 0 70px rgba(99,102,241,.16),
                0 10px 36px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .cta:active { transform:scale(.98); transition:transform .09s; }
  .cta-txt { position:relative; z-index:1; }
  .cta-arr {
    position:relative; z-index:1; font-size:20px; line-height:1;
    display:inline-block;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .cta:hover .cta-arr { transform:translateX(7px); }

  .dots { display:flex; gap:7px; margin-top:52px; align-items:center; }
  .dot {
    width:4px; height:4px; border-radius:50%;
    background:rgba(148,163,184,.2);
    animation: blink 3.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay:.55s; width:6px; height:6px; background:rgba(99,102,241,.45); }
  .dot:nth-child(3) { animation-delay:1.1s; }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

  footer {
    padding: 22px 40px; text-align:center;
    font-size:11px; color:rgba(148,163,184,.28);
    letter-spacing:.1em; text-transform:uppercase;
    position:relative; z-index:10;
  }

  .shoot {
    position:fixed; width:2px; height:2px; border-radius:50%;
    background:white; pointer-events:none; z-index:5; opacity:0;
  }

  @media(max-width:480px) {
    header { padding:18px 20px; }
    .soc { padding:8px 14px; font-size:12px; }
    .cta { padding:16px 38px; font-size:16px; }
    .orbital { width:120px; height:120px; margin-bottom:36px; }
    .ring1 { width:116px; height:116px; }
    .ring2 { width:86px; height:86px; }
    .ring3 { width:58px; height:58px; }
    .core { width:40px; height:40px; font-size:10px; }
    footer { padding:16px 20px; }
  }
</style>
</head>
<body>

<canvas id="cosmos"></canvas>
<div class="nebula nb1"></div>
<div class="nebula nb2"></div>
<div class="nebula nb3"></div>

<div class="page">

  <header>
    <a class="soc" href="https://x.com/WFSstudio" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.999 2.25H8.08l4.262 5.638L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
      <span>X</span>
    </a>
    <a class="soc" href="https://t.me/WFStudio_News" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      <span>Telegram</span>
    </a>
  </header>

  <main>
    <div class="orbital">
      <div class="ring ring1"><div class="rdot rdot1"></div></div>
      <div class="ring ring2"><div class="rdot rdot2"></div></div>
      <div class="ring ring3"><div class="rdot rdot3"></div></div>
      <div class="core">WF</div>
    </div>

    <h1>WFStudio</h1>
    <p class="sub">Where vision meets the void</p>

    <a class="cta" href="crypto-platform.html">
      <span class="cta-txt">Start</span>
      <span class="cta-arr">→</span>
    </a>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </main>

  <footer>WFStudio · 2025</footer>
</div>

<script>
const cv = document.getElementById('cosmos');
const cx = cv.getContext('2d');
let W, H, stars = [], dpr = Math.min(window.devicePixelRatio||1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.scale(dpr, dpr);
  buildStars();
}

function buildStars() {
  stars = [];
  const n = Math.floor((W * H) / 2600);
  for (let i = 0; i < n; i++) {
    const tinted = Math.random() < .18;
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.5 + .15,
      a: Math.random() * .85 + .15,
      spd: Math.random() * .005 + .001,
      ph: Math.random() * Math.PI * 2,
      hue: tinted ? (Math.random() < .5 ? 230 : 270) : 0,
      sat: tinted ? 75 : 0
    });
  }
}

function drawStars(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of stars) {
    const alpha = (Math.sin(t * s.spd + s.ph) * .38 + .62) * s.a;
    cx.fillStyle = s.hue
      ? `hsla(${s.hue},${s.sat}%,82%,${alpha})`
      : `rgba(255,255,255,${alpha * .92})`;
    cx.beginPath();
    cx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    cx.fill();
  }
}

function shootStar() {
  const el = document.createElement('div');
  el.className = 'shoot';
  document.body.appendChild(el);
  const sx = Math.random() * W * .68, sy = Math.random() * H * .42;
  const ang = (22 + Math.random() * 22) * Math.PI / 180;
  const len = 130 + Math.random() * 200;
  const ex = sx + Math.cos(ang) * len, ey = sy + Math.sin(ang) * len;
  const dur = 550 + Math.random() * 450, t0 = performance.now();
  el.style.cssText = `left:${sx}px;top:${sy}px;
    box-shadow:0 0 4px 1px white,0 0 8px 2px rgba(167,139,250,.65);`;

  function frame(now) {
    const p = Math.min((now - t0) / dur, 1);
    const e = p < .5 ? 2*p*p : -1+(4-2*p)*p;
    el.style.left = (sx + (ex-sx)*e) + 'px';
    el.style.top  = (sy + (ey-sy)*e) + 'px';
    el.style.opacity = p < .25 ? p/.25 : 1-(p-.25)/.75;
    p < 1 ? requestAnimationFrame(frame) : el.remove();
  }
  requestAnimationFrame(frame);
}

function schedShoot() {
  shootStar();
  setTimeout(schedShoot, 3200 + Math.random() * 6500);
}

function loop(t) {
  drawStars(t * .001);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
setTimeout(schedShoot, 2200);
requestAnimationFrame(loop);
</script>
</body>
</html>
